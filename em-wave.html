<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电磁波传播 · 3D物理仿真</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, 'Microsoft YaHei', sans-serif; background: #0a0a1a; color: #fff; overflow: hidden; }
    #app { display: flex; width: 100vw; height: 100vh; position: relative; }
    #canvas-area { flex: 1; min-width: 0; position: relative; }
    #sidebar {
      width: clamp(260px, 22vw, 340px);
      min-width: 260px;
      max-width: 340px;
      padding: 20px;
      background: rgba(0,0,0,0.85);
      overflow-y: auto;
      border-left: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.3s ease, opacity 0.3s ease;
      z-index: 10;
    }
    #sidebar-toggle {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 20;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.2);
      color: #4fc3f7;
      font-size: 20px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    #sidebar-toggle:hover { background: rgba(79,195,247,0.15); }
    #sidebar.collapsed { transform: translateX(100%); opacity: 0; pointer-events: none; }
    @media (max-width: 900px) {
      #sidebar {
        position: absolute;
        right: 0;
        top: 0;
        height: 100vh;
        width: clamp(280px, 70vw, 360px);
        box-shadow: -4px 0 20px rgba(0,0,0,0.5);
      }
      #sidebar-toggle { display: flex; }
    }
    @media (max-width: 600px) {
      #sidebar { width: 85vw; }
    }
    .section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #4fc3f7; }
    .slider-group { margin-bottom: 16px; }
    .slider-group label { display: flex; justify-content: space-between; font-size: 13px; color: #aaa; margin-bottom: 6px; }
    .slider-group .val { color: #4fc3f7; font-family: monospace; }
    .slider-group input[type="range"] { width: 100%; accent-color: #4fc3f7; }
    .btn-group { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .btn { padding: 8px 16px; border: 1px solid #4fc3f7; background: transparent; color: #4fc3f7; cursor: pointer; border-radius: 4px; font-size: 13px; }
    .btn:hover { background: rgba(79,195,247,0.15); }
    .btn.active { background: rgba(79,195,247,0.25); }
    .knowledge-card { margin-top: 16px; padding: 14px; background: rgba(255,255,255,0.05); border-radius: 8px; }
    .knowledge-card h4 { font-size: 14px; color: #4fc3f7; margin-bottom: 8px; }
    .knowledge-card p { font-size: 13px; line-height: 1.7; color: #ccc; }
    .formula { color: #4fc3f7; font-family: 'Times New Roman', serif; font-style: italic; }
    .phenomena-list { padding-left: 16px; margin-top: 8px; }
    .phenomena-list li { margin-bottom: 4px; font-size: 12px; color: #bbb; }
    .legend { display: flex; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #aaa; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div id="canvas-area"></div>
    <button id="sidebar-toggle" title="切换面板">☰</button>
    <div id="sidebar">
      <div class="section-title">物理 · 电磁学 · 电磁波传播</div>

      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#4fc3f7;"></div>电场 E</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff7043;"></div>磁场 B</div>
        <div class="legend-item"><div class="legend-dot" style="background:#66bb6a;"></div>传播方向</div>
      </div>

      <div class="slider-group">
        <label>波长 λ <span class="val" id="val-wavelength">4.0</span> m</label>
        <input type="range" id="slider-wavelength" min="1" max="10" step="0.1" value="4.0">
      </div>
      <div class="slider-group">
        <label>频率 f <span class="val" id="val-frequency">1.0</span> Hz</label>
        <input type="range" id="slider-frequency" min="0.1" max="3" step="0.1" value="1.0">
      </div>
      <div class="slider-group">
        <label>振幅 E₀ <span class="val" id="val-amplitude">1.5</span></label>
        <input type="range" id="slider-amplitude" min="0.3" max="3" step="0.1" value="1.5">
      </div>
      <div class="slider-group">
        <label>动画速度 <span class="val" id="val-speed">1.0</span>x</label>
        <input type="range" id="slider-speed" min="0.1" max="3" step="0.1" value="1.0">
      </div>

      <div class="btn-group">
        <button class="btn active" id="btn-play">播放</button>
        <button class="btn" id="btn-pause">暂停</button>
        <button class="btn" id="btn-reset">重置</button>
      </div>

      <div class="knowledge-card">
        <h4>核心公式</h4>
        <div id="formula-e"></div>
        <div id="formula-b" style="margin-top:8px;"></div>
        <div id="formula-c" style="margin-top:8px;"></div>
      </div>
      <div class="knowledge-card">
        <h4>观察要点</h4>
        <ul class="phenomena-list">
          <li>电场E和磁场B始终相互垂直，且都垂直于传播方向</li>
          <li>E和B同相位振荡，振幅比满足 E₀/B₀ = c</li>
          <li>增大波长→波形变疏，增大频率→波形运动加快</li>
          <li>拖拽画面可旋转视角，滚轮缩放</li>
        </ul>
      </div>
      <div class="knowledge-card">
        <h4>常见误解</h4>
        <ul class="phenomena-list">
          <li>电场和磁场不是交替产生，而是同时存在、同相振荡</li>
          <li>电磁波传播不需要介质，可在真空中传播</li>
        </ul>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // === 侧边栏折叠控制 ===
    const toggle = document.getElementById('sidebar-toggle');
    const sidebar = document.getElementById('sidebar');
    if (window.innerWidth <= 600) sidebar.classList.add('collapsed');
    toggle.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      toggle.textContent = sidebar.classList.contains('collapsed') ? '☰' : '✕';
    });

    // === KaTeX公式渲染 ===
    function renderKatex(id, latex) {
      const el = document.getElementById(id);
      if (el && typeof katex !== 'undefined') {
        katex.render(latex, el, { throwOnError: false, displayMode: true });
      }
    }
    renderKatex('formula-e', 'E = E_0 \\cos(kx - \\omega t)');
    renderKatex('formula-b', 'B = B_0 \\cos(kx - \\omega t)');
    renderKatex('formula-c', 'c = \\lambda f = \\frac{1}{\\sqrt{\\mu_0 \\varepsilon_0}}');

    // === 数值安全守卫 ===
    function safeVal(v) { return isFinite(v) ? v : 0; }
    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    // === 参数 ===
    let wavelength = 4.0;
    let frequency = 1.0;
    let amplitude = 1.5;
    let speed = 1.0;
    let playing = true;
    let time = 0;

    const sliderWavelength = document.getElementById('slider-wavelength');
    const sliderFrequency = document.getElementById('slider-frequency');
    const sliderAmplitude = document.getElementById('slider-amplitude');
    const sliderSpeed = document.getElementById('slider-speed');

    sliderWavelength.addEventListener('input', () => {
      wavelength = clamp(parseFloat(sliderWavelength.value), 1, 10);
      document.getElementById('val-wavelength').textContent = wavelength.toFixed(1);
    });
    sliderFrequency.addEventListener('input', () => {
      frequency = clamp(parseFloat(sliderFrequency.value), 0.1, 3);
      document.getElementById('val-frequency').textContent = frequency.toFixed(1);
    });
    sliderAmplitude.addEventListener('input', () => {
      amplitude = clamp(parseFloat(sliderAmplitude.value), 0.3, 3);
      document.getElementById('val-amplitude').textContent = amplitude.toFixed(1);
    });
    sliderSpeed.addEventListener('input', () => {
      speed = clamp(parseFloat(sliderSpeed.value), 0.1, 3);
      document.getElementById('val-speed').textContent = speed.toFixed(1);
    });

    document.getElementById('btn-play').addEventListener('click', () => {
      playing = true;
      document.getElementById('btn-play').classList.add('active');
      document.getElementById('btn-pause').classList.remove('active');
    });
    document.getElementById('btn-pause').addEventListener('click', () => {
      playing = false;
      document.getElementById('btn-pause').classList.add('active');
      document.getElementById('btn-play').classList.remove('active');
    });
    document.getElementById('btn-reset').addEventListener('click', () => {
      time = 0;
      playing = true;
      wavelength = 4.0; sliderWavelength.value = 4.0;
      frequency = 1.0; sliderFrequency.value = 1.0;
      amplitude = 1.5; sliderAmplitude.value = 1.5;
      speed = 1.0; sliderSpeed.value = 1.0;
      document.getElementById('val-wavelength').textContent = '4.0';
      document.getElementById('val-frequency').textContent = '1.0';
      document.getElementById('val-amplitude').textContent = '1.5';
      document.getElementById('val-speed').textContent = '1.0';
      document.getElementById('btn-play').classList.add('active');
      document.getElementById('btn-pause').classList.remove('active');
    });

    // === Three.js场景初始化 ===
    const canvasArea = document.getElementById('canvas-area');
    const w = canvasArea.clientWidth, h = canvasArea.clientHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1a);
    scene.fog = new THREE.FogExp2(0x0a0a1a, 0.02);

    const camera = new THREE.PerspectiveCamera(55, w / h, 0.1, 200);
    camera.position.set(6, 5, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    canvasArea.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 3;
    controls.maxDistance = 30;

    // === 光照 ===
    const ambientLight = new THREE.AmbientLight(0x404060, 1.2);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(5, 8, 5);
    scene.add(dirLight);

    // === 网格地面 ===
    const gridHelper = new THREE.GridHelper(20, 20, 0x1a1a3a, 0x1a1a3a);
    gridHelper.position.y = -2.5;
    scene.add(gridHelper);

    // === 坐标轴（传播方向） ===
    const axisLen = 10;
    // X轴 - 传播方向（绿色）
    const axisMatX = new THREE.LineBasicMaterial({ color: 0x66bb6a });
    const axisGeoX = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-axisLen/2, 0, 0),
      new THREE.Vector3(axisLen/2, 0, 0)
    ]);
    scene.add(new THREE.Line(axisGeoX, axisMatX));

    // 传播方向箭头
    const arrowDir = new THREE.Vector3(1, 0, 0);
    const arrowOrigin = new THREE.Vector3(axisLen/2, 0, 0);
    const arrowHelper = new THREE.ArrowHelper(arrowDir, arrowOrigin, 0.8, 0x66bb6a, 0.3, 0.2);
    scene.add(arrowHelper);

    // === 波形参数 ===
    const segCount = 300;
    const xRange = 12;

    // 电场波形 (E - 沿Y轴振动, 蓝色)
    const ePositions = new Float32Array(segCount * 3);
    const eColors = new Float32Array(segCount * 3);
    const eGeometry = new THREE.BufferGeometry();
    eGeometry.setAttribute('position', new THREE.BufferAttribute(ePositions, 3));
    eGeometry.setAttribute('color', new THREE.BufferAttribute(eColors, 3));

    const eLineMat = new THREE.LineBasicMaterial({ vertexColors: true, linewidth: 2 });
    const eLine = new THREE.Line(eGeometry, eLineMat);
    scene.add(eLine);

    // 磁场波形 (B - 沿Z轴振动, 橙色)
    const bPositions = new Float32Array(segCount * 3);
    const bColors = new Float32Array(segCount * 3);
    const bGeometry = new THREE.BufferGeometry();
    bGeometry.setAttribute('position', new THREE.BufferAttribute(bPositions, 3));
    bGeometry.setAttribute('color', new THREE.BufferAttribute(bColors, 3));

    const bLineMat = new THREE.LineBasicMaterial({ vertexColors: true, linewidth: 2 });
    const bLine = new THREE.Line(bGeometry, bLineMat);
    scene.add(bLine);

    // === 场线（从波形到轴的垂直线） ===
    const fieldLineCount = 40;
    const eFieldPositions = new Float32Array(fieldLineCount * 6);
    const bFieldPositions = new Float32Array(fieldLineCount * 6);
    const eFieldGeo = new THREE.BufferGeometry();
    eFieldGeo.setAttribute('position', new THREE.BufferAttribute(eFieldPositions, 3));
    const bFieldGeo = new THREE.BufferGeometry();
    bFieldGeo.setAttribute('position', new THREE.BufferAttribute(bFieldPositions, 3));

    const eFieldMat = new THREE.LineBasicMaterial({ color: 0x4fc3f7, transparent: true, opacity: 0.2 });
    const bFieldMat = new THREE.LineBasicMaterial({ color: 0xff7043, transparent: true, opacity: 0.2 });
    const eFieldLines = new THREE.LineSegments(eFieldGeo, eFieldMat);
    const bFieldLines = new THREE.LineSegments(bFieldGeo, bFieldMat);
    scene.add(eFieldLines);
    scene.add(bFieldLines);

    // === 传播方向粒子 ===
    const particleCount = 60;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    const particleSizes = new Float32Array(particleCount);
    for (let i = 0; i < particleCount; i++) {
      particlePos[i * 3] = -xRange/2 + (i / particleCount) * xRange;
      particlePos[i * 3 + 1] = 0;
      particlePos[i * 3 + 2] = 0;
      particleSizes[i] = 2.0;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    particleGeo.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));
    const particleMat = new THREE.PointsMaterial({
      color: 0x66bb6a,
      size: 0.06,
      transparent: true,
      opacity: 0.4,
      sizeAttenuation: true
    });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // === 更新函数 ===
    function updateWave(t) {
      const safeAmp = safeVal(amplitude);
      const safeLambda = clamp(safeVal(wavelength), 0.1, 20);
      const safeFreq = clamp(safeVal(frequency), 0.01, 10);
      const k = (2 * Math.PI) / safeLambda;
      const omega = 2 * Math.PI * safeFreq;

      // 更新电场波形
      for (let i = 0; i < segCount; i++) {
        const x = -xRange/2 + (i / (segCount - 1)) * xRange;
        const eVal = safeAmp * Math.cos(k * x - omega * t);
        ePositions[i * 3] = safeVal(x);
        ePositions[i * 3 + 1] = safeVal(eVal);
        ePositions[i * 3 + 2] = 0;

        // 颜色：蓝→白渐变表示振幅
        const intensity = Math.abs(eVal) / safeAmp;
        eColors[i * 3] = safeVal(0.31 + 0.69 * intensity);
        eColors[i * 3 + 1] = safeVal(0.76 + 0.24 * intensity);
        eColors[i * 3 + 2] = safeVal(0.97);
      }
      eGeometry.attributes.position.needsUpdate = true;
      eGeometry.attributes.color.needsUpdate = true;

      // 更新磁场波形
      for (let i = 0; i < segCount; i++) {
        const x = -xRange/2 + (i / (segCount - 1)) * xRange;
        const bVal = safeAmp * Math.cos(k * x - omega * t);
        bPositions[i * 3] = safeVal(x);
        bPositions[i * 3 + 1] = 0;
        bPositions[i * 3 + 2] = safeVal(bVal);

        const intensity = Math.abs(bVal) / safeAmp;
        bColors[i * 3] = safeVal(1.0);
        bColors[i * 3 + 1] = safeVal(0.44 + 0.56 * intensity);
        bColors[i * 3 + 2] = safeVal(0.26 + 0.74 * intensity);
      }
      bGeometry.attributes.position.needsUpdate = true;
      bGeometry.attributes.color.needsUpdate = true;

      // 更新场线
      const step = Math.max(1, Math.floor(segCount / fieldLineCount));
      for (let i = 0; i < fieldLineCount; i++) {
        const idx = Math.min(i * step, segCount - 1);
        const x = ePositions[idx * 3];
        const eY = ePositions[idx * 3 + 1];
        const bZ = bPositions[idx * 3 + 2];

        eFieldPositions[i * 6] = safeVal(x);
        eFieldPositions[i * 6 + 1] = 0;
        eFieldPositions[i * 6 + 2] = 0;
        eFieldPositions[i * 6 + 3] = safeVal(x);
        eFieldPositions[i * 6 + 4] = safeVal(eY);
        eFieldPositions[i * 6 + 5] = 0;

        bFieldPositions[i * 6] = safeVal(x);
        bFieldPositions[i * 6 + 1] = 0;
        bFieldPositions[i * 6 + 2] = 0;
        bFieldPositions[i * 6 + 3] = safeVal(x);
        bFieldPositions[i * 6 + 4] = 0;
        bFieldPositions[i * 6 + 5] = safeVal(bZ);
      }
      eFieldGeo.attributes.position.needsUpdate = true;
      bFieldGeo.attributes.position.needsUpdate = true;
    }

    // === 动画循环 ===
    let lastTime = 0;
    function animate(timestamp) {
      requestAnimationFrame(animate);
      let dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;
      dt = clamp(dt, 0, 0.05);

      if (playing) {
        time += dt * speed;
      }

      updateWave(time);
      controls.update();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    // === resize处理 ===
    window.addEventListener('resize', () => {
      const w = canvasArea.clientWidth;
      const h = canvasArea.clientHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });
  </script>
</body>
</html>
